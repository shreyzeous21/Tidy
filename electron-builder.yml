appId: com.shrey.tidy
productName: Tidy
# Always includes the architecture so the Intel and Apple silicon installers
# can never be confused: Tidy-0.1.0-arm64.dmg / Tidy-0.1.0-x64.dmg.
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.utilities
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Signing/notarization credentials are not configured; local builds are unsigned.
  identity: null
